x-newrelic-env: &newrelic-env
  CORECLR_ENABLE_PROFILING: "1"
  CORECLR_PROFILER: "{36032161-FFC0-4B61-B559-F6C5D41BAE5A}"
  CORECLR_NEWRELIC_HOME: /usr/local/newrelic-dotnet-agent
  CORECLR_PROFILER_PATH: /usr/local/newrelic-dotnet-agent/libNewRelicProfiler.so
  NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://otlp.nr-data.net"
  OTEL_EXPORTER_OTLP_HEADERS: "api-key=${NEW_RELIC_LICENSE_KEY:-}"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_METRIC_EXPORT_INTERVAL: "10000"

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: eshop-postgres
    environment:
      POSTGRES_DB: eshopdb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Pass1234}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d eshopdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: eshop-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/eShop.ApiHost/Dockerfile
    container_name: eshop-api
    ports:
      - "8081:8081"
    environment:
      <<: *newrelic-env
      OTEL_SERVICE_NAME: eShop.ApiHost
      ASPNETCORE_ENVIRONMENT: Development
      # REST (HTTP/1.1) — porta 8080
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Http__Protocols: Http1
      # gRPC (HTTP/2 cleartext, prior knowledge) — porta 8081
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      Kestrel__Endpoints__Grpc__Protocols: Http2
      ConnectionStrings__eshopdb: Host=postgres;Database=eshopdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Pass1234}
      ConnectionStrings__redis: ${REDIS_CONNECTIONSTRING:-redis:6379}
      Identity__Url: https://api.eshop:8443
      BasketApiClient: https://api.eshop:8443
      OrderingApiClient: https://api.eshop:8443
      WebhooksApiClient: https://api.eshop:8443
      WebhooksWebClient: http://localhost:${WEBHOOKSCLIENT_PORT:-8082}
      WebAppClient: https://webapp.eshop:8443
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  webapp:
    build:
      context: .
      dockerfile: src/WebApp/Dockerfile
    container_name: eshop-webapp
    environment:
      <<: *newrelic-env
      OTEL_SERVICE_NAME: WebApp
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      services__api__http__0: https://api.eshop:8443
      services__api__http2__0: https://api.eshop:8443
      # H2C (HTTP/2 sem TLS) necessário para o gRPC client do Basket
      DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT: "1"
      IdentityUrl: https://api.eshop:8443
      CallBackUrl: https://webapp.eshop:8443
      BasketGrpcUrl: http://api:8081
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: eshop-nginx
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      default:
        aliases:
          - api.eshop
          - webapp.eshop
    depends_on:
      api:
        condition: service_healthy
      webapp:
        condition: service_started

  newrelic-infra:
    image: newrelic/infrastructure-bundle:latest
    container_name: newrelic-infra
    privileged: true
    network_mode: host
    pid: host
    cap_add:
      - SYS_PTRACE
    environment:
      - NRIA_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NRIA_DISPLAY_NAME=eshop-docker-host
      - NRIA_OVERRIDE_HOSTNAME_SHORT=eshop-docker-host
    volumes:
      - "/:/host:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      
volumes:
  postgres-data:
    
networks:
  default:
    name: eshop-net
