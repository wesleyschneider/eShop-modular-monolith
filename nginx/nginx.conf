worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # HTTP → HTTPS redirect for all five hosts
    server {
        listen 8080;
        server_name identity.eshop webapp.eshop basket.eshop catalog.eshop ordering.eshop;
        return 301 https://$host:8443$request_uri;
    }

    # identity.eshop → identity-api:8080
    server {
        listen 8443 ssl;
        server_name identity.eshop;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        proxy_buffer_size       512k;
        proxy_buffers           8 512k;
        proxy_busy_buffers_size 1m;

        location / {
            proxy_pass         http://identity-api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host  $http_host;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "";
        }
    }

    # webapp.eshop → webapp:8080
    server {
        listen 8443 ssl;
        server_name webapp.eshop;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        proxy_buffer_size       512k;
        proxy_buffers           8 512k;
        proxy_busy_buffers_size 1m;

        location / {
            proxy_pass         http://webapp:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host  $http_host;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "";
        }
    }

    # basket.eshop → basket-api:8080 (REST/Swagger only, gRPC stays internal)
    server {
        listen 8443 ssl;
        server_name basket.eshop;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass         http://basket-api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host  $http_host;
        }
    }

    # catalog.eshop → catalog-api:8080
    server {
        listen 8443 ssl;
        server_name catalog.eshop;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass         http://catalog-api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host  $http_host;
        }
    }

    # ordering.eshop → ordering-api:8080
    server {
        listen 8443 ssl;
        server_name ordering.eshop;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass         http://ordering-api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-Host  $http_host;
        }
    }
}
